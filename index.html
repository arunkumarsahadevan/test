<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Application Project 2 – Africa PRD Tickets Dashboard</title>
<script src="https://cdn.plot.ly/plotly-3.4.0.min.js"></script>
<style>
body{font-family:system-ui;background:#f6f8fb;margin:0}
header{padding:10px 16px;background:#fff;border-bottom:1px solid #ddd}
.layout{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px}
.panel{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #ddd;padding:6px;font-size:12px}
th{background:#f1f5f9}
.res-link{color:#2563eb;cursor:pointer;font-weight:600}
.res-link:hover{text-decoration:underline}
</style>
</head>
<body>
<header><b>Application Project 2 – Africa PRD Tickets Dashboard</b></header>
<div class="layout">
<aside class="panel">
<h3>Filters</h3>
<label>Assignee Drilldown</label>
<div><b id="activeAssignee">All</b></div>
<button id="clearDrill">Clear Drilldown</button>
</aside>
<main>
<section class="panel kpis">
<div>Open Tickets<br><b id="kpiOpen">—</b></div>
<div>Response SLA %<br><b id="kpiResp">—</b></div>
<div>Resolution SLA %<br><b id="kpiReso">—</b></div>
</section>
<section class="panel"><h3>2) Resource Efficiency Scorecard</h3><div id="scorecard"></div></section>
<section class="panel"><h3>Tickets (Drilldown)</h3><div id="tickets"></div></section>
</main>
</div>
<script>
let DATA=[], ACTIVE_ASSIGNEE=null;
const parseDate=v=>{if(!v)return null;const d=new Date(v);return isNaN(d)?null:d;};
async function load(){
 const res=await fetch('tickets.json?ts='+Date.now());
 DATA=await res.json();
 DATA.forEach(r=>{r._closed=parseDate(r.ClosingDate)});
 renderAll();
}
function renderAll(){
 const rows = ACTIVE_ASSIGNEE ? DATA.filter(r=>String(r.AssigntoUserName||'Unassigned')===ACTIVE_ASSIGNEE) : DATA;
 document.getElementById('activeAssignee').textContent = ACTIVE_ASSIGNEE||'All';
 document.getElementById('kpiOpen').textContent = rows.filter(r=>!r._closed).length;
 renderScorecard(DATA);
 renderTickets(rows);
}
function renderScorecard(rows){
 const map={};
 rows.forEach(r=>{
 const a=r.AssigntoUserName||'Unassigned';
 if(!map[a]) map[a]={a,t:0,o:0,c:0};
 map[a].t++; r._closed?map[a].c++:map[a].o++;
 });
 let html='<table><tr><th>Resource</th><th>Tickets</th><th>Open</th><th>Closed</th></tr>';
 Object.values(map).forEach(v=>{
 html+=`<tr><td><span class="res-link" data-res="${v.a}">${v.a}</span></td><td>${v.t}</td><td>${v.o}</td><td>${v.c}</td></tr>`;
 });
 html+='</table>';
 document.getElementById('scorecard').innerHTML=html;
 document.querySelectorAll('.res-link').forEach(el=>{
 el.onclick=()=>{ACTIVE_ASSIGNEE=el.dataset.res;renderAll();};
 });
}
function renderTickets(rows){
 let html='<table><tr><th>Ticket ID</th><th>Customer</th><th>Project</th><th>Status</th><th>Assignee</th></tr>';
 rows.forEach(r=>{html+=`<tr><td>${r.Ticketid}</td><td>${r.Customername}</td><td>${r.ProjectName}</td><td>${r.CurrentStatus}</td><td>${r.AssigntoUserName||'Unassigned'}</td></tr>`;});
 html+='</table>';
 document.getElementById('tickets').innerHTML=html;
}
document.getElementById('clearDrill').onclick=()=>{ACTIVE_ASSIGNEE=null;renderAll();};
load();
</script>
</body>
</html>
