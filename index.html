
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tickets Dashboard</title>
  <style>
    :root{--bg:#f7fafc;--card:#fff;--text:#111;--muted:#555;--blue:#2563eb}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e7eb}
    .wrap{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center}
    h1{margin:0;font-size:18px;font-weight:800}
    .toolbar{margin-left:auto;display:flex;gap:8px}
    button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
    button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
    main{max-width:1200px;margin:16px auto;padding:0 16px;display:grid;gap:16px}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    @media (max-width:820px){.cards{grid-template-columns:1fr}}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
    .kpi .label{font-size:12px;color:var(--muted)}
    .kpi .value{font-size:22px;font-weight:800;margin-top:2px}
    .table-wrap{overflow:auto;max-height:70vh}
    table{border-collapse:collapse;min-width:1200px}
    th,td{border:1px solid #e5e7eb;padding:8px 10px;font-size:12px}
    thead th{position:sticky;top:0;background:#eef2ff}
    #status{position:fixed;right:16px;bottom:16px;background:rgba(37,99,235,.95);color:#fff;border-radius:10px;padding:8px 10px;box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);transition:all .2s}
    #status.show{opacity:1;transform:translateY(0)}
    .error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:8px;padding:8px 10px}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Tickets Dashboard</h1>
      <div class="toolbar">
        <button id="reload" class="primary">Reload</button>
      </div>
    </div>
  </header>

  <main>
    <section class="cards">
      <div class="card kpi"><div class="label">Total tickets</div><div class="value" id="k_total">—</div></div>
      <div class="card kpi"><div class="label">Open tickets</div><div class="value" id="k_open">—</div></div>
      <div class="card kpi"><div class="label">Resolution SLA %</div><div class="value" id="k_reso">—</div></div>
    </section>

    <section class="card">
      <h3 style="margin:0 0 8px">Tickets</h3>
      <div class="table-wrap">
        <table id="tbl"><thead></thead><tbody></tbody></table>
      </div>
    </section>

    <div id="errorBox" class="error" style="display:none"></div>
  </main>

  <div id="status" role="status" aria-live="polite">Loading…</div>

  <script>
  // ---------- Utilities ----------
  function parseMaybeDate(s){ const d = new Date(s); return isFinite(d) ? d : null; }
  function toast(msg){ const el=document.getElementById('status'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 1200); }
  function showError(msg){ const box=document.getElementById('errorBox'); box.style.display='block'; box.textContent = msg; }

  // ---------- Rendering ----------
  function renderKPIs(rows){
    const total = rows.length;
    const open  = rows.filter(r=>{ const cd = r.ClosingDate==null? '' : String(r.ClosingDate); return !cd || cd.trim()===''; }).length;
    const resoYes  = rows.filter(r=> String(r['Resolution_TicketSLAMet'] || '').toLowerCase()==='yes').length;
    const resoBase = rows.filter(r=> r['Resolution_TicketSLAMet']!=null && r['Resolution_TicketSLAMet']!=='').length;
    document.getElementById('k_total').textContent = total;
    document.getElementById('k_open').textContent  = open;
    document.getElementById('k_reso').textContent  = resoBase? (100*resoYes/resoBase).toFixed(1)+'%':'—';
  }

  function renderTable(rows){
    // Columns are auto-detected from first row, then a friendly order is enforced if present
    const preferred = ['Ticketid','Customername','ProjectName','NewgenSeverity','UserEnvironmentType','Support_Scope','ReportingTime','FirstResponseTime','ClosingDate','CurrentStatus','AssigntoUserName','Subject'];
    const keys = rows.length? Array.from(new Set([ ...preferred, ...Object.keys(rows[0]) ])) : preferred;
    const thead = document.querySelector('#tbl thead');
    const tbody = document.querySelector('#tbl tbody');
    thead.innerHTML = '<tr>'+ keys.map(k=>`<th>${k}</th>`).join('') + '</tr>';
    tbody.innerHTML = rows.map(r=> '<tr>' + keys.map(k=>`<td>${(r[k]??'')}</td>`).join('') + '</tr>').join('');
  }

  function renderAll(rows){ renderKPIs(rows); renderTable(rows); toast(`Data updated · ${rows.length} tickets`); }

  // ---------- Data loading ----------
  async function fetchTicketsJSON(){
    const u = new URL('./tickets.json', location.href); // project-page safe
    u.searchParams.set('ts', Date.now());               // cache-bust
    const res = await fetch(u.toString(), { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} — ${res.url}`);
    const text = await res.text();
    if (/^\s*</.test(text)) { throw new Error('Received HTML instead of JSON (is tickets.json missing or in wrong folder?)'); }
    let data; try { data = JSON.parse(text); } catch(e){ console.warn('[head]', text.slice(0,160)); throw e; }
    if (!Array.isArray(data)) throw new Error('tickets.json must be a JSON array at the root.');
    return data;
  }

  async function boot(){
    try { const data = await fetchTicketsJSON(); renderAll(data); }
    catch(e){ console.error(e); showError(e.message); }
  }

  document.getElementById('reload').addEventListener('click', async ()=>{
    try { const data = await fetchTicketsJSON(); renderAll(data); }
    catch(e){ alert('Reload failed: '+e.message); }
  });

  setInterval(async ()=>{ try{ const d=await fetchTicketsJSON(); renderAll(d); } catch(_){} }, 30000);

  boot();
  </script>
</body>
</html>
