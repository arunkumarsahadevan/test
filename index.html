<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Application Project 2 – Africa PRD Tickets Dashboard</title>
<script src="https://cdn.plot.ly/plotly-3.4.0.min.js"></script>
<style>
body{font-family:system-ui;background:#f6f8fb;margin:0;color:#0f172a}
header{padding:10px 16px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between}
.layout{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{border:1px solid #e5e7eb;border-radius:8px;padding:8px}
h3{margin:0 0 8px;font-size:14px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #e5e7eb;padding:6px;font-size:12px}
th{background:#f1f5f9}
.res-link{color:#2563eb;font-weight:700;cursor:pointer}
.res-link:hover{text-decoration:underline}
.badge{font-size:11px;padding:2px 6px;border-radius:999px}
.badge.green{background:#dcfce7;color:#166534}
.badge.red{background:#fee2e2;color:#991b1b}
#error{display:none;margin:8px;background:#fee2e2;color:#991b1b;padding:8px;border-radius:8px}
</style>
</head>
<body>
<header>
<b>Application Project 2 – Africa PRD Tickets Dashboard</b>
<div>
<button id="clearDrill">Clear Drilldown</button>
<button id="reload">Reload</button>
</div>
</header>
<div id="error"></div>
<div class="layout">
<aside class="panel">
<h3>Drilldown</h3>
<div>Active Resource: <b id="activeRes">All</b></div>
</aside>
<main>
<section class="panel kpis">
<div class="kpi">Open Tickets<br><b id="kpiOpen">—</b></div>
<div class="kpi">Response SLA %<br><b id="kpiResp">—</b></div>
<div class="kpi">Resolution SLA %<br><b id="kpiReso">—</b></div>
</section>
<section class="panel"><h3>2) Resource Efficiency Scorecard</h3><div id="scorecard"></div></section>
<section class="panel"><h3>3) SLA Compliance</h3><div id="chartSLA" style="height:260px"></div></section>
<section class="panel"><h3>4) Top Customers</h3><div id="chartTop" style="height:260px"></div></section>
<section class="panel"><h3>5) Tickets (Drilldown Result)</h3><div id="tickets"></div></section>
</main>
</div>
<script>
let DATA=[], ACTIVE=null;
const parseDate=v=>{if(!v)return null;const d=new Date(v);return isNaN(d)?null:d;};
function showError(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block';}
async function load(){
 try{
 const r=await fetch('tickets.json?ts='+Date.now());
 DATA=await r.json();
 DATA.forEach(x=>{x._closed=parseDate(x.ClosingDate)});
 render();
 }catch(e){showError(e.message)}
}
function render(){
 const rows = ACTIVE? DATA.filter(r=>String(r.AssigntoUserName||'Unassigned')===ACTIVE):DATA;
 document.getElementById('activeRes').textContent = ACTIVE||'All';
 document.getElementById('kpiOpen').textContent = rows.filter(r=>!r._closed).length;
 const rBase=rows.filter(r=>r.Response_TicketSLAMet).length;
 const rYes=rows.filter(r=>String(r.Response_TicketSLAMet).toLowerCase()==='yes').length;
 const rsBase=rows.filter(r=>r.Resolution_TicketSLAMet).length;
 const rsYes=rows.filter(r=>String(r.Resolution_TicketSLAMet).toLowerCase()==='yes').length;
 document.getElementById('kpiResp').textContent=rBase?(100*rYes/rBase).toFixed(1)+'%':'—';
 document.getElementById('kpiReso').textContent=rsBase?(100*rsYes/rsBase).toFixed(1)+'%':'—';
 renderScorecard(DATA);
 renderTickets(rows);
 renderSLA(rows);
 renderTop(rows);
}
function renderScorecard(rows){
 const m={}; rows.forEach(r=>{const a=r.AssigntoUserName||'Unassigned';if(!m[a])m[a]={a,t:0,o:0,c:0};m[a].t++;r._closed?m[a].c++:m[a].o++;});
 let h='<table><tr><th>Resource</th><th>Tickets</th><th>Open</th><th>Closed</th></tr>';
 Object.values(m).forEach(v=>{h+=`<tr><td><span class="res-link" data-r="${v.a}">${v.a}</span></td><td>${v.t}</td><td>${v.o}</td><td>${v.c}</td></tr>`});
 h+='</table>'; document.getElementById('scorecard').innerHTML=h;
 document.querySelectorAll('.res-link').forEach(e=>e.onclick=()=>{ACTIVE=e.dataset.r;render();});
}
function renderTickets(rows){let h='<table><tr><th>Ticket</th><th>Customer</th><th>Project</th><th>Status</th></tr>';
 rows.forEach(r=>h+=`<tr><td>${r.Ticketid}</td><td>${r.Customername}</td><td>${r.ProjectName}</td><td>${r.CurrentStatus}</td></tr>`);
 h+='</table>';document.getElementById('tickets').innerHTML=h;}
function renderSLA(rows){const y=rows.filter(r=>String(r.Response_TicketSLAMet).toLowerCase()==='yes').length;const n=rows.filter(r=>String(r.Response_TicketSLAMet).toLowerCase()==='no').length;Plotly.newPlot('chartSLA',[{values:[y,n],labels:['Met','Breach'],type:'pie'}]);}
function renderTop(rows){const m={};rows.forEach(r=>{const c=r.Customername||'Other';m[c]=(m[c]||0)+1});const e=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5);Plotly.newPlot('chartTop',[{x:e.map(v=>v[0]),y:e.map(v=>v[1]),type:'bar'}]);}
document.getElementById('clearDrill').onclick=()=>{ACTIVE=null;render();};
document.getElementById('reload').onclick=load;
load();
</script>
</body>
</html>
